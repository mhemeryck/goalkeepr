[project]
name = "goalkeepr"
version = "0.1.0"
description = "Fast, mobile-first youth football score recording"
requires-python = ">=3.14"
dependencies = [
  "django>=6.1,<6.2",
  "django-environ>=0.12,<1",
  "django-stubs-ext>=6.1,<6.2",
  "psycopg[binary]>=3.2,<4",
  "uvicorn>=0.35,<1",
  "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
  "django-stubs>=6.1,<6.2",
  "mypy>=1.17,<2",
  "pytest>=9.1.1,<10",
  "pytest-django>=4.11,<5",
  "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "goalkeepr.test_settings"
testpaths = ["**/tests"]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]

[tool.mypy]
python_version = "3.14"
plugins = ["mypy_django_plugin.main"]
strict = true
exclude = ["tracker/migrations"]

[tool.django-stubs]
django_settings_module = "goalkeepr.settings"
