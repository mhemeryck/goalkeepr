{% extends "base.html" %}

{% block title %}Edit player | Goalkeepr{% endblock %}

{% block content %}
  <section class="form-card">
    <p class="eyebrow">Household team</p>
    <h1>Edit player</h1>
    <form method="post">
      {% csrf_token %}
      {{ form.non_field_errors }}
      <p>
        {{ form.name.label_tag }}
        {{ form.name }}
        {{ form.name.errors }}
      </p>
      <button type="submit">Save player</button>
    </form>
  </section>
{% endblock %}
