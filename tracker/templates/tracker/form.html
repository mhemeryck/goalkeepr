{% extends "base.html" %}
{% load static %}

{% block title %}{{ title }} | Goalkeepr{% endblock %}

{% block content %}
  <section class="form-card">
    <p class="eyebrow">Goalkeepr</p>
    <h1>{{ title }}</h1>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit">Save</button>
    </form>
  </section>
{% endblock %}

{% block scripts %}
  {% if is_match_form %}<script src="{% static 'js/match-form.js' %}" defer></script>{% endif %}
{% endblock %}
