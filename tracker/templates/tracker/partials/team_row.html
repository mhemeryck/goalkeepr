<article id="team-{{ result.team.pk }}" class="team-row">
  <a class="team-name" href="{% url 'team-edit' result.team.pk %}#team-{{ result.team.pk }}" hx-get="{% url 'team-edit' result.team.pk %}" hx-target="#team-{{ result.team.pk }}" hx-swap="outerHTML">
    <strong>{{ result.team }}</strong>
    <small>{{ result.wins }} win{{ result.wins|pluralize }} &middot; {{ result.draws }} draw{{ result.draws|pluralize }} &middot; {{ result.losses }} loss{{ result.losses|pluralize:"es" }}</small>
  </a>
  <form class="team-delete" method="post" action="{% url 'team-delete' result.team.pk %}" onsubmit="return confirm('Delete this team?')">
    {% csrf_token %}
    <button class="delete-team-button" type="submit" aria-label="Delete {{ result.team }}" title="{% if result.match_count %}Delete matches first{% else %}Delete {{ result.team }}{% endif %}" {% if result.match_count %}disabled{% endif %}>&times;</button>
  </form>
</article>
