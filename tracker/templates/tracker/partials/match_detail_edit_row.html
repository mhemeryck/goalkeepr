<form id="match-detail-{{ field_name }}" class="match-detail-row match-detail-editing" method="post" action="{% url 'match-field-edit' match.pk field_name %}" hx-post="{% url 'match-field-edit' match.pk field_name %}" hx-target="#match-detail-{{ field_name }}" hx-swap="outerHTML">
  {% csrf_token %}
  <label class="match-detail-label" for="{{ field.id_for_label }}">{{ field_label }}</label>
  <div class="match-detail-control">
    {{ field }}
    <button type="submit">Save</button>
    {{ field.errors }}
    {{ form.non_field_errors }}
  </div>
  <span class="visually-hidden" aria-hidden="true" hx-get="{% url 'match-field-edit' match.pk field_name %}?cancel=1" hx-trigger="keydown[key=='Escape'] from:body" hx-target="#match-detail-{{ field_name }}" hx-swap="outerHTML">Cancel edit</span>
</form>
