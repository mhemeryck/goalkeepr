<article class="match-card">
  <a id="match-link-{{ match.pk }}" class="match-card-link" href="{% url 'match-detail' match.pk %}">
    <div>
      <span class="match-date">{{ match.match_date|date:"D j M Y" }}</span>
      <strong>{% if match.is_home %}{{ TEAM_NAME }}{% else %}{{ match.opponent_name }}{% endif %}</strong>
      <strong>{% if match.is_home %}{{ match.opponent_name }}{% else %}{{ TEAM_NAME }}{% endif %}</strong>
    </div>
    <div class="compact-score" aria-label="Score {{ match.home_score_value }} to {{ match.away_score_value }}">
      <strong>{{ match.home_score_value }}</strong>
      <span>–</span>
      <strong>{{ match.away_score_value }}</strong>
    </div>
  </a>
</article>
