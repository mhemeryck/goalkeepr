{% extends "base.html" %}

{% block title %}Log in | Goalkeepr{% endblock %}

{% block content %}
  <section class="auth-card">
    <p class="eyebrow">Match day starts here</p>
    <h1>Log in</h1>
    {% if form.errors %}<p class="error-message">Your username or password was not recognised.</p>{% endif %}
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
      <button type="submit">Log in</button>
    </form>
  </section>
{% endblock %}
