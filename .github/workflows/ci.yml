name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    env:
      SECRETSPEC_PROVIDER: env
      BILLING_ALERT_EMAIL: ci@example.invalid
    concurrency:
      group: quality-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Install Nix
        uses: cachix/install-nix-action@v31
      - name: Configure devenv cache
        uses: cachix/cachix-action@v16
        with:
          name: devenv
      - name: Install devenv
        run: nix profile add nixpkgs#devenv
      - name: Run quality checks
        run: devenv test

  terraform-plan:
    name: Terraform plan
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      SECRETSPEC_PROVIDER: env
      BILLING_ALERT_EMAIL: ${{ vars.BILLING_ALERT_EMAIL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Install Nix
        uses: cachix/install-nix-action@v31
      - name: Configure devenv cache
        uses: cachix/cachix-action@v16
        with:
          name: devenv
      - name: Install devenv
        run: nix profile add nixpkgs#devenv
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: eu-central-1
          role-to-assume: arn:aws:iam::109185239364:role/home-github-actions
      - name: Configure Kubernetes access
        env:
          KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG }}
        run: |
          umask 077
          printf '%s' "${KUBECONFIG_CONTENT}" > "${RUNNER_TEMP}/kubeconfig"
          printf 'TF_VAR_kubeconfig_path=%s\n' "${RUNNER_TEMP}/kubeconfig" >> "${GITHUB_ENV}"
      - name: Plan Terraform
        run: devenv shell terraform_plan

  release:
    name: Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: quality
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Determine release version
        id: version
        shell: bash
        run: |
          prefix="$(date -u +'%Y.%m.%d')"
          sequence=1

          while IFS= read -r tag; do
            suffix="${tag#"${prefix}."}"
            if [[ "${suffix}" =~ ^[0-9]+$ ]] && (( suffix >= sequence )); then
              sequence=$((suffix + 1))
            fi
          done < <(git tag --list "${prefix}.*")

          echo "value=${prefix}.${sequence}" >> "${GITHUB_OUTPUT}"
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build and publish Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            mhemeryck/goalkeepr:${{ steps.version.outputs.value }}
            mhemeryck/goalkeepr:latest
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: gh release create "${VERSION}" --target "${GITHUB_SHA}" --title "${VERSION}" --generate-notes

  deploy:
    name: Apply infrastructure
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      SECRETSPEC_PROVIDER: env
      BILLING_ALERT_EMAIL: ${{ vars.BILLING_ALERT_EMAIL }}
      TF_VAR_image: mhemeryck/goalkeepr:${{ needs.release.outputs.version }}
    concurrency:
      group: terraform-apply
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Install Nix
        uses: cachix/install-nix-action@v31
      - name: Configure devenv cache
        uses: cachix/cachix-action@v16
        with:
          name: devenv
      - name: Install devenv
        run: nix profile add nixpkgs#devenv
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: eu-central-1
          role-to-assume: arn:aws:iam::109185239364:role/home-github-actions
      - name: Configure Kubernetes access
        env:
          KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG }}
        run: |
          umask 077
          printf '%s' "${KUBECONFIG_CONTENT}" > "${RUNNER_TEMP}/kubeconfig"
          printf 'TF_VAR_kubeconfig_path=%s\n' "${RUNNER_TEMP}/kubeconfig" >> "${GITHUB_ENV}"
      - name: Apply Terraform
        run: devenv shell deploy
