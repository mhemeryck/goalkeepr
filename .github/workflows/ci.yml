name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    concurrency:
      group: quality-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: 0.9.26
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - name: Collect static assets
        run: uv run python manage.py collectstatic --noinput
      - name: Run tests
        run: uv run pytest
      - name: Run linting
        run: uv run ruff check .
      - name: Run type checks
        run: uv run mypy .

  release:
    name: Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Determine release version
        id: version
        shell: bash
        run: |
          prefix="$(date -u +'%Y.%m.%d')"
          sequence=1

          while IFS= read -r tag; do
            suffix="${tag#"${prefix}."}"
            if [[ "${suffix}" =~ ^[0-9]+$ ]] && (( suffix >= sequence )); then
              sequence=$((suffix + 1))
            fi
          done < <(git tag --list "${prefix}.*")

          echo "value=${prefix}.${sequence}" >> "${GITHUB_OUTPUT}"
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and publish Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            mhemeryck/goalkeepr:${{ steps.version.outputs.value }}
            mhemeryck/goalkeepr:latest
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: gh release create "${VERSION}" --target "${GITHUB_SHA}" --title "${VERSION}" --generate-notes
