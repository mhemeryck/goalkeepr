services:
  app:
    build: .
    command: >-
      sh -c "python manage.py migrate &&
      uvicorn goalkeepr.asgi:application --host 0.0.0.0 --port 8000"
    environment:
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DJANGO_DEBUG: "true"
      DJANGO_SECRET_KEY: local-compose-only
      POSTGRES_DB: goalkeepr
      POSTGRES_HOST: db
      POSTGRES_PASSWORD: goalkeepr
      POSTGRES_USER: goalkeepr
      PRIMARY_CLUB_NAME: ${PRIMARY_CLUB_NAME:-K.F.C. Sparta Kolmont}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz/')
      interval: 2s
      timeout: 3s
      retries: 15

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: goalkeepr
      POSTGRES_PASSWORD: goalkeepr
      POSTGRES_USER: goalkeepr
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goalkeepr -d goalkeepr"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - postgres-data:/var/lib/postgresql

volumes:
  postgres-data:
